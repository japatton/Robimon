; Robimon — Waveshare ESP32-S3-Touch-AMOLED-1.75 firmware
; ESP32-S3R8 (8 MB OPI PSRAM, 16 MB QIO flash). Arduino-ESP32 core 3.x via pioarduino.

[platformio]
default_envs = robimon
src_dir = src

[env:robimon]
; pioarduino tracks the latest stable Arduino-ESP32 core (3.x / IDF 5.x).
; The Waveshare reference examples are written against Arduino-ESP32 3.3.5;
; we match that here to avoid having to port the CO5300 driver.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; ESP32-S3R8: 8 MB OPI PSRAM, 16 MB QIO flash
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

build_flags =
  -DBOARD_HAS_PSRAM
  ; native USB-CDC for serial-over-USB-C — H2 RXD/TXD pins (GPIO 43/44) are also wired to U0,
  ; so using the H2 header for an external UART will fight the USB serial monitor.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; project version (single source of truth, surfaced on About screen)
  -DROBIMON_VERSION=\"0.12.0-voice-J\"
  ; compile-time log level: 0=none, 1=error, 2=warn, 3=info, 4=debug
  -DROBIMON_LOG_LEVEL=3
  ; play a short audible tone at end of setup() to confirm audio works.
  ; flip to 1 to re-test audio.
  -DROBIMON_BOOT_TEST_TONE=0
  -I src
  -O2
build_unflags = -O0

lib_deps =
  ; CO5300 panel driver and the QSPI bus class we hand to it
  moononournation/GFX Library for Arduino @ ^1.5.6
  ; CST9217 capacitive touch (CST92xx family) + QMI8658 IMU + PCF85063 RTC drivers
  lewisxhe/SensorLib @ ^0.4.0
  ; AXP2101 PMIC driver (battery, charging, PWRKEY events)
  lewisxhe/XPowersLib @ ^0.3.0
  ; Home Assistant WebSocket client + JSON
  links2004/WebSockets @ ^2.6.1
  bblanchon/ArduinoJson @ ^7.4.1
  ; NimBLE — lighter-footprint BLE stack than Arduino-ESP32's BluedroidBLE.
  ; Used for bot-to-bot proximity detection (RSSI only, no GATT data).
  h2zero/NimBLE-Arduino @ ^2.1.2
